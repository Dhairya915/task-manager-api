name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_manager_test_db
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node_modules/.bin/prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_manager_test_db

      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_manager_test_db
          JWT_ACCESS_SECRET: test_secret_key_123
          JWT_REFRESH_SECRET: test_refresh_secret_456
          MONGO_URL: mongodb://localhost:27017/task_manager_logs