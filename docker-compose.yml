services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/task_manager_db
      - NODE_ENV=production
      - JWT_ACCESS_SECRET=HelloFriends
      - JWT_REFRESH_SECRET=MyNameIsDhairya
      - MONGO_URL=mongodb://mongo:27017/task_manager_logs
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=task_manager_db
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"